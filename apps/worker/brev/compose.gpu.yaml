# NVIDIA Brev GPU instance (Part 3): both Nemotron models AND the worker on one box.
#   :8001  vision  nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8
#   :8002  agent   nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8 (native tool calling)
#   worker         claims jobs from SpacetimeDB, calls the two models over the compose network
# Nothing is published on the host: the models are reachable only by the worker, and the worker only makes outbound
# connections (SpacetimeDB Maincloud, FEMA/NWS/Census). SpacetimeDB is the whole backend: data, jobs, auth and files.
# Sized for one 80 GB GPU (Brev: 1x H100 80GB). On the instance, from the repo root:
#   cp apps/worker/brev/brev.env.example apps/worker/brev/.env   # set NEMOTRON_API_KEY and STDB_SERVICE_TOKEN
#   docker compose -f apps/worker/brev/compose.gpu.yaml --env-file apps/worker/brev/.env up -d --build
#   docker compose -f apps/worker/brev/compose.gpu.yaml logs -f

x-vllm: &vllm
  image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.28.0}
  restart: unless-stopped
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HOME: /models
    NEMOTRON_API_KEY: ${NEMOTRON_API_KEY:?set NEMOTRON_API_KEY in .env}
  volumes:
    - hf-cache:/models
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  nemotron-vl:
    <<: *vllm
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        exec vllm serve nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8
        --trust-remote-code
        --quantization modelopt
        --max-model-len 16384
        --gpu-memory-utilization ${VL_GPU_FRACTION:-0.30}
        --max-num-seqs 16
        --structured-outputs-config '{"backend": "guidance", "disable_any_whitespace": true}'
        --api-key "$$NEMOTRON_API_KEY"
        --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 120s

  nemotron-agent:
    <<: *vllm
    # Start after the vision server has claimed its share of GPU memory, so the two don't race at startup.
    depends_on:
      nemotron-vl:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        PARSER=$$(python3 -c "from huggingface_hub import hf_hub_download as d; print(d('nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8', 'nano_v3_reasoning_parser.py'))")
        && exec vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
        --trust-remote-code
        --max-model-len 32768
        --kv-cache-dtype fp8
        --gpu-memory-utilization ${AGENT_GPU_FRACTION:-0.60}
        --max-num-seqs 16
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --reasoning-parser-plugin "$$PARSER"
        --reasoning-parser nano_v3
        --api-key "$$NEMOTRON_API_KEY"
        --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 180s

  worker:
    build:
      context: ../../..
      dockerfile: apps/worker/brev/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      nemotron-vl:
        condition: service_healthy
      nemotron-agent:
        condition: service_healthy
    environment:
      STDB_URI: ${STDB_URI:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:-aftermath-hackutd-dev}
      STDB_SERVICE_TOKEN: ${STDB_SERVICE_TOKEN:?set STDB_SERVICE_TOKEN in .env (the registered worker token)}
      NEMOTRON_VL_BASE_URL: http://nemotron-vl:8001/v1
      NEMOTRON_AGENT_BASE_URL: http://nemotron-agent:8002/v1
      NEMOTRON_API_KEY: ${NEMOTRON_API_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      VL_CONCURRENCY: ${VL_CONCURRENCY:-2}
      USE_FIXTURES: "false"
    volumes:
      - vl-cache:/root/.cache/aftermath-vl

volumes:
  hf-cache:
  vl-cache:
